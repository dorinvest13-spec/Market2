<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04070a">
<title>AI-Пост · Ozon</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Playfair+Display:wght@600;800&family=Unbounded:wght@600;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#04070a; --bg1:#0a1014; --ink:#e9f5ef; --muted:#7e8b94; --line:rgba(140,255,205,.15); --neon:#2bffa8; --vio:#8b5cff; --gold:#ffd166; --danger:#ff5c7a; --inp:rgba(3,9,11,.6); }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:Manrope,system-ui,sans-serif; color:var(--ink); background:linear-gradient(180deg,var(--bg1),var(--bg)); min-height:100vh; padding-bottom:40px; }
button, input, select, textarea { font:inherit; color:inherit; }
.app { max-width:480px; margin:0 auto; padding:12px 16px; }
.head { position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px; margin:0 -16px 12px; padding:12px 16px; background:rgba(10,16,20,.92); backdrop-filter:blur(16px); border-bottom:1px solid var(--line); }
.logo { font-weight:800; font-size:15px; }
.logo i { color:var(--neon); font-style:normal; }
.tabs { margin-left:auto; display:flex; gap:4px; }
.tab { padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--muted); font-size:12px; font-weight:700; cursor:pointer; }
.tab.on { color:var(--bg); background:linear-gradient(120deg,#3ee6c4,var(--neon)); border-color:transparent; }
.card { border-radius:16px; margin-bottom:12px; background:rgba(14,22,26,.6); border:1px solid var(--line); padding:14px; }
.tag { font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
.tag b { color:var(--neon); }
.tag button.clear { background:none; border:none; color:var(--danger); font-size:10px; cursor:pointer; text-transform:none; letter-spacing:0; }
label { display:block; margin:10px 0 5px; font-size:11px; color:var(--muted); }
input[type=text], input[type=password], textarea { width:100%; padding:11px; border-radius:10px; border:1px solid var(--line); background:var(--inp); font-size:14px; }
input:focus, textarea:focus { outline:none; border-color:var(--neon); }
.row { display:flex; gap:8px; }
.row > * { flex:1; }
button.primary { width:100%; padding:13px; margin-top:10px; border-radius:12px; border:none; cursor:pointer; font-weight:800; font-size:14px; color:var(--bg); background:linear-gradient(120deg,#7c4dff,#3ee6c4 55%,var(--neon)); }
button.secondary { width:100%; padding:11px; margin-top:8px; border-radius:12px; cursor:pointer; font-weight:700; font-size:13px; color:var(--ink); background:rgba(139,92,255,.15); border:1px solid rgba(139,92,255,.4); }
button.ghost { width:100%; padding:11px; margin-top:8px; border-radius:12px; cursor:pointer; font-weight:700; font-size:13px; color:#4dc3ff; background:rgba(77,195,255,.1); border:1px solid rgba(77,195,255,.4); }
button:disabled { opacity:.5; cursor:progress; }
.chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.chip { padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--muted); font-size:12px; font-weight:700; cursor:pointer; }
.chip.on { color:var(--bg); background:linear-gradient(120deg,#3ee6c4,var(--neon)); border-color:transparent; }
.upload { aspect-ratio:1; border-radius:12px; border:2px dashed var(--line); display:grid; place-items:center; background:var(--inp); cursor:pointer; position:relative; overflow:hidden; }
.upload img { width:100%; height:100%; object-fit:contain; background:#000; }
.upload .plus { font-size:36px; color:var(--muted); text-align:center; line-height:1.2; }
.upload .plus span { font-size:12px; display:block; margin-top:5px; }
.upload .rm { position:absolute; top:6px; right:6px; width:28px; height:28px; border-radius:50%; border:none; background:rgba(0,0,0,.7); color:white; font-size:14px; cursor:pointer; }
canvas { width:100%; aspect-ratio:1; border-radius:14px; display:block; background:#0a1014; touch-action:none; }
.hint { margin-top:8px; padding:8px 10px; border-radius:8px; font-size:11px; color:var(--muted); background:rgba(43,255,168,.08); border-left:3px solid var(--neon); }
#toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(80px); padding:12px 18px; border-radius:12px; font-size:13px; font-weight:700; background:rgba(14,22,26,.95); border:1px solid var(--line); opacity:0; transition:.3s; z-index:100; max-width:90%; text-align:center; }
#toast.show { transform:translateX(-50%); opacity:1; }
#toast.ok { border-color:var(--neon); color:var(--neon); }
#toast.err { border-color:var(--danger); color:#ffb7c3; }
#toast.warn { border-color:var(--gold); color:var(--gold); }
</style>

<body>

<section id="tab-settings" hidden>

    <input type="text" id="cfgUrl" placeholder="https://giga-proxy.dorinvest13.workers.dev">

<script>
const S = {
  photo: null, refPhoto: null, title: '', price: '', oldPrice: '', badge: '', link: '',
  template: 'promo', bg: null, customStyle: null, ozonDesc: '',
  scale: 1, ox: 0, oy: 0, rot: 0,
  platform: 'vk', tone: 'selling',
  cfg: { url: '', token: '' }
};

const LS = { cfg: 'aipost.cfg', state: 'aipost.state' };

const TPL = {
  promo:   { grad: ['#7c4dff', '#2bffa8'], headColor: '#ffffff', badgeColor: '#ffd166', font: 'Manrope' },
  minimal: { grad: ['#f5f7fa', '#e0e5eb'], headColor: '#111111', badgeColor: '#2bffa8', font: 'Manrope' },
  sale:    { grad: ['#ff3d5a', '#ff9f1c'], headColor: '#ffffff', badgeColor: '#ffffff', font: 'Manrope' },
  premium: { grad: ['#0a0a0a', '#1a1a2e'], headColor: '#ffd166', badgeColor: '#ffd166', font: 'Manrope' }
};

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let toastT;
function toast(msg, kind = 'ok', dur = 3200) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show ' + kind;
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.className = ''; }, dur);
}

function saveCfg() {
  S.cfg.url = ($('#cfgUrl').value || '').trim();
  S.cfg.token = ($('#cfgTok').value || '').trim();
  localStorage.setItem(LS.cfg, JSON.stringify(S.cfg));
}
function loadCfg() {
  try { const raw = localStorage.getItem(LS.cfg); if (raw) S.cfg = JSON.parse(raw); } catch {}
  if ($('#cfgUrl')) $('#cfgUrl').value = S.cfg.url || '';
  if ($('#cfgTok')) $('#cfgTok').value = S.cfg.token || '';
}
function persist() {
  try {
    localStorage.setItem(LS.state, JSON.stringify({
      title: S.title, price: S.price, oldPrice: S.oldPrice,
      badge: S.badge, link: S.link, template: S.template,
      platform: S.platform, tone: S.tone,
      scale: S.scale, ox: S.ox, oy: S.oy, rot: S.rot,
      customStyle: S.customStyle, ozonDesc: S.ozonDesc,
      postText: $('#postText').value || ''
    }));
  } catch {}
}
function restore() {
  try {
    const raw = localStorage.getItem(LS.state);
    if (!raw) return;
    const d = JSON.parse(raw);
    S.title = d.title || ''; S.price = d.price || ''; S.oldPrice = d.oldPrice || '';
    S.badge = d.badge || ''; S.link = d.link || '';
    S.template = d.template || 'promo'; S.platform = d.platform || 'vk'; S.tone = d.tone || 'selling';
    S.scale = d.scale ?? 1; S.ox = d.ox ?? 0; S.oy = d.oy ?? 0; S.rot = d.rot ?? 0;
    S.customStyle = d.customStyle || null; S.ozonDesc = d.ozonDesc || '';
    
    if ($('#title')) $('#title').value = S.title;
    if ($('#price')) $('#price').value = S.price;
    if ($('#oldPrice')) $('#oldPrice').value = S.oldPrice;
    if ($('#link')) $('#link').value = S.link;
    if ($('#postText')) $('#postText').value = d.postText || '';
    
    if (S.customStyle) {
      $('#templates [data-tp="custom"]').style.display = 'inline-block';
      renderStyleResult(S.customStyle);
    }
  } catch {}
}

function loadImage(src, timeout = 25000) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.crossOrigin = 'anonymous';
    const t = setTimeout(() => rej(new Error('timeout')), timeout);
    im.onload = () => { clearTimeout(t); res(im); };
    im.onerror = () => { clearTimeout(t); rej(new Error('load fail')); };
    im.src = src;
  });
}
function isWhiteBg(im) {
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 24;
    const x = c.getContext('2d');
    x.drawImage(im, 0, 0, 24, 24);
    const d = x.getImageData(0, 0, 24, 24).data;
    let s = 0, n = 0;
    for (let i = 0; i < d.length; i += 4) { s += (d[i] + d[i+1] + d[i+2]) / 3; n++; }
    return s / n > 225;
  } catch { return false; }
}
function compress(file, maxSize = 1400) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => {
      const im = new Image();
      im.onload = () => {
        const c = document.createElement('canvas');
        let w = im.width, h = im.height;
        if (w > h && w > maxSize) { h = h * maxSize / w; w = maxSize; }
        else if (h >= w && h > maxSize) { w = w * maxSize / h; h = maxSize; }
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(im, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', 0.88));
      };
      im.onerror = () => rej(new Error('decode'));
      im.src = e.target.result;
    };
    r.onerror = () => rej(new Error('read'));
    r.readAsDataURL(file);
  });
}

const card = $('#card');
const ctx = card.getContext('2d');

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function renderCard(size) {
  let bg1, bg2, headColor, badgeColor, fontFamily;
  
  if (S.template === 'custom' && S.customStyle) {
    bg1 = S.customStyle.bgColor || '#222';
    bg2 = S.customStyle.bgColor || '#222';
    headColor = S.customStyle.textColor || '#fff';
    badgeColor = S.customStyle.accentColor || '#ffd166';
    
    const f = S.customStyle.fontStyle || 'sans-serif';
    if (f === 'serif') fontFamily = "'Playfair Display', serif";
    else if (f === 'display') fontFamily = "'Unbounded', sans-serif";
    else if (f === 'handwritten') fontFamily = "'Caveat', cursive";
    else fontFamily = 'Manrope, sans-serif';
  } else {
    const t = TPL[S.template] || TPL.promo;
    bg1 = t.grad[0]; bg2 = t.grad[1];
    headColor = t.headColor; badgeColor = t.badgeColor;
    fontFamily = 'Manrope, sans-serif';
  }

  ctx.clearRect(0, 0, size, size);
  
  if (S.bg) {
    const sc = Math.max(size / S.bg.width, size / S.bg.height);
    const dw = S.bg.width * sc, dh = S.bg.height * sc;
    ctx.drawImage(S.bg, (size - dw) / 2, (size - dh) / 2, dw, dh);
  } else {
    const g = ctx.createLinearGradient(0, 0, size, size);
    g.addColorStop(0, bg1);
    g.addColorStop(1, bg2);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
  }

  const k = size / 1080;
  if (S.photo) {
    if (S.photo._wb === undefined) S.photo._wb = isWhiteBg(S.photo);
    const wb = S.photo._wb;
    const s = size * 0.62 * S.scale;
    const x = (size - s) / 2 + S.ox * k;
    const y = (size - s) / 2 + S.oy * k;
    const r = (S.rot * Math.PI) / 180;
    
    if (wb) {
      ctx.save();
      ctx.translate(x + s / 2, y + s * 0.94);
      ctx.scale(1, 0.22);
      const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 0.55);
      rg.addColorStop(0, 'rgba(0,0,0,.5)');
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(0, 0, s * 0.55, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.save();
    ctx.translate(x + s / 2, y + s / 2);
    ctx.rotate(r);
    if (!wb) {
      ctx.shadowColor = 'rgba(0,0,0,.4)';
      ctx.shadowBlur = 30 * k;
      ctx.fillStyle = '#fff';
      roundRect(ctx, -s/2, -s/2, s, s, 30 * k);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.save();
    roundRect(ctx, -s/2, -s/2, s, s, 30 * k);
    ctx.clip();
    if (wb) ctx.globalCompositeOperation = 'multiply';
    const sc2 = Math.max(s / S.photo.width, s / S.photo.height);
    const dw2 = S.photo.width * sc2, dh2 = S.photo.height * sc2;
    ctx.drawImage(S.photo, -dw2/2, -dh2/2, dw2, dh2);
    ctx.restore();
    ctx.restore();
  }

  ctx.fillStyle = 'rgba(0,0,0,.6)';
  roundRect(ctx, 40 * k, size - 280 * k, size - 80 * k, 240 * k, 30 * k);
  ctx.fill();

  if (S.title) {
    ctx.fillStyle = headColor;
    ctx.font = `800 ${56 * k}px ${fontFamily}`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(S.title.slice(0, 26), 80 * k, size - 200 * k);
  }
  if (S.price) {
    ctx.fillStyle = headColor;
    ctx.font = `800 ${68 * k}px ${fontFamily}`;
    ctx.fillText(S.price + ' ₽', 80 * k, size - 105 * k);
    if (S.oldPrice) {
      const priceW = ctx.measureText(S.price + ' ₽').width;
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      ctx.font = `600 ${38 * k}px ${fontFamily}`;
      ctx.fillText(S.oldPrice + ' ₽', 80 * k + priceW + 30 * k, size - 105 * k);
      const ow = ctx.measureText(S.oldPrice + ' ₽').width;
      ctx.strokeStyle = 'rgba(255,255,255,.45)';
      ctx.lineWidth = 3 * k;
      ctx.beginPath();
      ctx.moveTo(80 * k + priceW + 30 * k, size - 105 * k);
      ctx.lineTo(80 * k + priceW + 30 * k + ow, size - 105 * k);
      ctx.stroke();
    }
  }
  
  if (S.badge) {
    ctx.fillStyle = badgeColor;
    ctx.beginPath();
    ctx.arc(size - 130 * k, 130 * k, 90 * k, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.font = `800 ${44 * k}px ${fontFamily}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(S.badge.slice(0, 8), size - 130 * k, 132 * k);
  }
}

let drag = null, pinch = null;
const pointers = new Map();

card.addEventListener('pointerdown', e => {
  card.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    drag = { ox0: S.ox, oy0: S.oy, x0: e.clientX, y0: e.clientY };
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const dx = b.x - a.x, dy = b.y - a.y;
    pinch = { d0: Math.hypot(dx, dy), a0: Math.atan2(dy, dx), s0: S.scale, r0: S.rot };
    drag = null;
  }
  $('#resetPos').style.display = 'block';
});
card.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const ratio = 1080 / card.clientWidth;
  if (pointers.size === 1 && drag) {
    S.ox = drag.ox0 + (e.clientX - drag.x0) * ratio;
    S.oy = drag.oy0 + (e.clientY - drag.y0) * ratio;
    renderCard(1080);
  } else if (pointers.size === 2 && pinch) {
    const [a, b] = [...pointers.values()];
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy);
    const ang = Math.atan2(dy, dx);
    S.scale = Math.max(0.3, Math.min(2.5, pinch.s0 * d / pinch.d0));
    S.rot = Math.max(-45, Math.min(45, pinch.r0 + (ang - pinch.a0) * 180 / Math.PI));
    renderCard(1080);
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) { drag = null; persist(); }
}
card.addEventListener('pointerup', endPointer);
card.addEventListener('pointercancel', endPointer);

async function aiText(prompt) {
  if (!S.cfg.url || !S.cfg.token) throw new Error('AI не настроен → ⚙');
  const r = await fetch(S.cfg.url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-app-token': S.cfg.token },
    body: JSON.stringify({ prompt, kind: 'creative' })
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || d.error) throw new Error(d.error || 'HTTP ' + r.status);
  return d.text || '';
}
async function aiImage(prompt) {
  if (!S.cfg.url || !S.cfg.token) throw new Error('AI не настроен → ⚙');
  const r = await fetch(S.cfg.url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-app-token': S.cfg.token },
    body: JSON.stringify({ action: 'image', prompt })
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || !d.image) throw new Error(d.error || 'HTTP ' + r.status);
  return d.image;
}
async function aiVision(prompt, base64Image) {
  if (!S.cfg.url || !S.cfg.token) throw new Error('AI не настроен → ⚙');
  const r = await fetch(S.cfg.url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-app-token': S.cfg.token },
    body: JSON.stringify({ action: 'vision', prompt, image: base64Image })
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || d.error) throw new Error(d.error || 'HTTP ' + r.status);
  return d.text || '';
}

function renderStyleResult(style) {

  $('#styleResult').style.display = 'block';
  $('#styleResult').innerHTML = `

    Фон: <span style="color:${style.bgColor || '#000'}">⬤</span> ${style.bgColor || '—'}<br>
    Текст: <span style="color:${style.textColor || '#000'}">⬤</span> ${style.textColor || '—'}<br>
    Акцент: <span style="color:${style.accentColor || '#000'}">⬤</span> ${style.accentColor || '—'}<br>

$('#genStyle').onclick = async () => {
  if (!S.refPhoto) return toast('Загрузи карточку-пример', 'warn');

  btn.disabled = true;
  btn.textContent = '🪄 Анализирую…';
  
  const prompt = `Проанализируй дизайн этой карточки товара. Верни СТРОГО JSON без markdown:
  {
    "bgColor": "hex-код цвета фона",
    "textColor": "hex-код цвета текста",
    "accentColor": "hex-код цвета акцентов",
    "fontStyle": "sans-serif" | "serif" | "display" | "handwritten"
  }`;

    renderCard(1080);
    persist();

$('#loadOzon').onclick = async () => {
  const url = $('#link').value.trim();
  if (!url) return toast('Вставь ссылку на Ozon', 'warn');
  const btn = $('#loadOzon');
  btn.disabled = true;
  btn.textContent = '⏳';
  try {
    const r = await fetch(S.cfg.url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-app-token': S.cfg.token },
      body: JSON.stringify({ action: 'ozon', url })
    });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || 'API error');
    
    if (d.title) { $('#title').value = d.title.slice(0, 26); S.title = $('#title').value; }
    if (d.price) { $('#price').value = d.price; S.price = d.price; }
    if (d.oldPrice) { $('#oldPrice').value = d.oldPrice; S.oldPrice = d.oldPrice; }
    if (d.description) S.ozonDesc = d.description;
    
    if (d.images && d.images[0]) {
      try {
        const im = await loadImage(d.images[0]);
        S.photo = im;
        renderUploadPreview(d.images[0]);
      } catch (e) { console.warn('img load fail'); }
    }
    renderCard(1080);
    persist();
    toast('Данные загружены ✅');
  } catch (e) {
    toast('Ошибка: ' + e.message, 'err', 4000);
  }
  btn.disabled = false;
  btn.textContent = '📥';
};

$('#scanPhoto').onclick = async () => {
  if (!S.photo) return toast('Сначала загрузи фото товара', 'warn');
  const btn = $('#scanPhoto');
  btn.disabled = true;
  btn.textContent = '🤖 Анализирую…';
  
  const c = document.createElement('canvas');
  c.width = S.photo.width;
  c.height = S.photo.height;
  c.getContext('2d').drawImage(S.photo, 0, 0);
  const base64 = c.toDataURL('image/jpeg', 0.8);
  
  const prompt = `Вытащи данные с карточки Ozon. Верни СТРОГО JSON:
  {"title":"название (до 26 симв)","price":"цена числом","oldPrice":"старая цена","description":"краткое описание"}`;
  
  try {
    const res = await aiVision(prompt, base64);
    const match = res.match(/\{[\s\S]*\}/);
    if (!match) throw new Error('Не удалось распознать');
    const data = JSON.parse(match[0]);
    
    if (data.title) { $('#title').value = data.title.slice(0, 26); S.title = $('#title').value; }
    if (data.price) { $('#price').value = data.price; S.price = data.price; }
    if (data.oldPrice) { $('#oldPrice').value = data.oldPrice; S.oldPrice = data.oldPrice; }
    if (data.description) S.ozonDesc = data.description;
    
    renderCard(1080);
    persist();
    toast('Распознано ✅');
  } catch (e) {
    toast('Ошибка: ' + e.message, 'err', 4000);
  }
  btn.disabled = false;
  btn.textContent = '🤖 Распознать скриншот';
};

const PLATFORM_PROMPTS = {
  vk: 'ВКонтакте. До 1500 символов. Живой дружеский тон. Эмодзи умеренно. 2-3 хештега в конце. Призыв к действию.',
  tg: 'Telegram. До 1000 символов. Яркий хук в первой строке. Список преимуществ. 3-4 хештега. Призыв.',
  dzen: 'Яндекс Дзен. 1500-2500 символов. Экспертный тон, подзаголовки. Без эмодзи. Без хештегов.',
  ok: 'Одноклассники. До 1200 символов. Тёплый тон, обращение к аудитории, вопрос в конце. 2 хештега.'
};
const TONE_PROMPTS = {
  selling: 'продающий: акцент на выгоде, срочности. Подчёркивай скидку.',
  info: 'информативный: спокойно расскажи о товаре, характеристиках.',
  fun: 'с лёгким юмором: дружеский, живой.'
};
function buildPostPrompt() {
  return [
    'Ты — копирайтер. Напиши готовый пост для соцсетей. Без вступлений и пояснений — только готовый текст.',
    'ПЛОЩАДКА: ' + PLATFORM_PROMPTS[S.platform],
    'ТОН: ' + TONE_PROMPTS[S.tone],
    'ТОВАР: ' + (S.title || 'без названия'),
    'ЦЕНА: ' + (S.price ? S.price + ' ₽' : 'не указана') + (S.oldPrice ? ' (было ' + S.oldPrice + ' ₽)' : ''),
    S.badge ? 'БЕЙДЖ: ' + S.badge : '',
    S.link ? 'ССЫЛКА: ' + S.link + ' (упомяни как «купить по ссылке»)' : '',
    S.ozonDesc ? 'ОПИСАНИЕ: ' + S.ozonDesc : '',
    'Верни только текст поста на русском.'
  ].filter(Boolean).join('\n');
}

};

$('#copyText').onclick = async () => {
  const t = $('#postText').value.trim();
  if (!t) return toast('Пусто', 'warn');
  try {
    await navigator.clipboard.writeText(t);
    toast('Текст скопирован 📋');
  } catch { toast('Не скопировалось', 'err'); }
};

$('#shareAll').onclick = async () => {
  const t = $('#postText').value.trim();
  if (!t) return toast('Сначала текст', 'warn');
  try {
    const blob = await new Promise(res => card.toBlob(res, 'image/png'));
    const f = new File([blob], 'card.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      await navigator.share({ files: [f], text: t, title: S.title || 'Пост' });
      toast('Отправлено 📤');
    } else if (navigator.share) {
      await navigator.share({ text: t });
      toast('Текст отправлен. Фото сохрани отдельно', 'warn');
    } else {
      toast('Web Share не поддержан — копируй вручную', 'warn');
    }
  } catch (e) {
    if (e.name !== 'AbortError') toast('Ошибка: ' + e.message, 'err');
  }
};

$('#saveCfg').onclick = () => { saveCfg(); toast('Сохранено 💾'); };

$$('.tab').forEach(b => b.onclick = () => switchTab(b.dataset.t));
function switchTab(name) {
  $$('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === name));
  $$('section').forEach(s => s.hidden = s.id !== 'tab-' + name);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (name === 'result') renderCard(1080);
}

loadCfg();

  document.fonts.ready.then(() => renderCard(1080));
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
